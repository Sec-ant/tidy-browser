[package]
name = "browser-cookies"
version = "0.1.0"
edition = "2021"
authors = ["saying121 <saying121@outlook.com>"]
license = "LGPL-3.0-or-later"
description = "Lightweight library for parsing browser cookies"
repository = "https://github.com/Sec-ant/tidy-browser"
keywords = ["cookies", "browser", "chrome", "firefox", "safari", "napi"]

[lib]
crate-type = ["cdylib"]

[dependencies]
# NAPI-RS dependencies
napi = { version = "2", features = ["napi4", "serde-json", "tokio_rt"] }
napi-derive = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }

# Basic dependencies
dirs = "4"

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
